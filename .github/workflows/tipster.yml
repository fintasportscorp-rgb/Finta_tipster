name: Tipster weekly refresh

# Free, always-on runner. Sunday 22:00 UTC (~23:00 CET / 00:00 CEST).
# workflow_dispatch 'only' lets us run a single scraper for fast testing.
on:
  schedule:
    - cron: '0 22 * * 0'
  workflow_dispatch:
    inputs:
      only:
        description: 'comma-separated scrapers to run (blank = all)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: tipster-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chrome (for Selenium)
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests beautifulsoup4 selenium "understatapi==0.7.1" tqdm lxml cloudscraper

      - name: Run scrapers (resilient; report per-source result)
        env:
          ONLY: ${{ github.event.inputs.only }}
          SCRAPINGANT_KEY: ${{ secrets.SCRAPINGANT_KEY }}
          THEODDS_KEY: ${{ secrets.THEODDS_KEY }}
        run: |
          mkdir -p understat_data data input
          ALL="understat.py friendly_scraper.py soccerstats_scraper.py tm_absences.py formation_analysis.py get_odds.py expert_scraper.py"
          if [ -n "$ONLY" ]; then LIST=$(echo "$ONLY" | tr ',' ' '); else LIST="$ALL"; fi
          echo "Running: $LIST"
          for s in $LIST; do
            echo "::group::$s"
            if python "scripts/$s"; then echo "RESULT $s = OK"; else echo "RESULT $s = FAILED (continuing)"; fi
            echo "::endgroup::"
          done
          echo "=== produced CSVs ==="
          ls -la understat_data data input 2>/dev/null | grep -E '\.csv' || echo "(none)"

      - name: Build dashboard data
        if: ${{ github.event.inputs.only == '' }}
        run: python scripts/build_page.py

      - name: Guard + commit + push (Vercel auto-deploys)
        if: ${{ github.event.inputs.only == '' }}
        run: |
          size=$(stat -c%s web/public/data.json || echo 0)
          echo "data.json = $size bytes"
          if [ "$size" -lt 5000 ]; then
            echo "Placeholder-sized data.json ($size B) - NOT committing (keeping last good live)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html web/public/data.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "data: weekly tipster refresh (CI) $(date +%F)"
          git push
